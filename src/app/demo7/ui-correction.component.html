<div class="ui-correction">
  <div class="ui-correction__header">
    <h1>UI Korrektur</h1>
  </div>

  <div class="d-flex w-100 justify-content-end swich-wrapper">
    <div class="view-mode-switch">
      <button
        class="fd-button"
        [class.is-active]="!showOnlyHighlighted"
        (click)="showOnlyHighlighted = false"
      >
        Komplett
      </button>

      <button
        class="fd-button"
        [class.is-active]="showOnlyHighlighted"
        (click)="showOnlyHighlighted = true"
      >
        Auffälligkeiten
      </button>
    </div>
  </div>

  <div class="ui-correction__general" *ngIf="displayCorrectionData">
    <div
      class="ui-correction__general-field"
      *ngFor="let field of displayCorrectionData.generalFields"
    >
      <span class="field-label">{{ field.label }}</span>
      <span class="field-value">{{ field.value }}</span>
    </div>
  </div>

  <div class="ui-correction__scroll" *ngIf="displayCorrectionData">
    <section
      class="correction-page"
      *ngFor="let page of displayCorrectionData.pages; let pageIndex = index"
    >
      <div class="correction-page__left">
        <div class="field-table">
          <div class="field-table__row" *ngFor="let field of page.fields">
            <div class="field-table__label">{{ field.label }}</div>
            <div
              class="field-table__value"
              [class.is-highlighted]="field.highlighted"
            >
              {{ field.value }}
            </div>
          </div>
        </div>

        <div class="data-table-wrapper" *ngFor="let table of page.tables; let tableIndex = index">
          <table class="fd-table correction-table">
            <thead class="fd-table__header">
              <tr class="fd-table__row">
                <th class="fd-table__cell" *ngFor="let column of table.columns">
                  {{ column }}
                </th>
                <th class="fd-table__cell fd-table__cell--actions" *ngIf="!showOnlyHighlighted"></th>
              </tr>
            </thead>

            <tbody class="fd-table__body">
              <tr class="fd-table__row" *ngFor="let row of table.rows; let rowIndex = index">
                <td
                  class="fd-table__cell"
                  *ngFor="let cell of row"
                  [class.is-highlighted]="cell.highlighted"
                  [class.is-editing]="editingCell === cell"
                  (click)="startEdit(cell)"
                >
                  <span [style.visibility]="editingCell === cell ? 'hidden' : 'visible'">{{ cell.value }}</span>
                  <input
                    *ngIf="editingCell === cell"
                    class="cell-edit-input"
                    [(ngModel)]="editingValue"
                    [ngModelOptions]="{standalone: true}"
                    (blur)="commitEdit()"
                    (keydown.enter)="commitEdit()"
                    (keydown.escape)="cancelEdit()"
                  />
                </td>
                <td class="fd-table__cell fd-table__cell--actions" *ngIf="!showOnlyHighlighted">
                  <button
                    class="fd-button fd-button--transparent fd-button--compact row-delete-btn"
                    (click)="deleteRow(pageIndex, tableIndex, rowIndex)"
                    title="Zeile löschen"
                  >
                    <i class="sap-icon--delete"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>

          <button
            class="fd-button fd-button--transparent add-row-btn"
            *ngIf="!showOnlyHighlighted"
            (click)="addRow(pageIndex, tableIndex)"
          >
            <i class="sap-icon--add"></i>
            Zeile hinzufügen
          </button>
        </div>
      </div>

      <div class="correction-page__right">
        <img
          class="correction-page__image"
          [src]="page.image"
          alt="Document page"
        />
      </div>
    </section>
  </div>
</div>
